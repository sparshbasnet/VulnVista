# Core VulnVista app stack (backend + frontend, with optional local Postgres).
#
# Attaches to the `vulnvista_net` network as `external: true` — this file does
# not create it, so it doesn't fight lab/docker-compose.yml for ownership. Run
# ./scripts/setup.sh (or `docker network create vulnvista_net`) once first.

services:
  postgres:
    image: postgres:16-alpine
    container_name: vulnvista_postgres
    restart: unless-stopped
    # Optional local database. Not started by default — the backend points at
    # Neon (see DATABASE_URL in .env). Start it with `--profile local-db` for
    # offline/local development.
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulnvista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-dev}
      POSTGRES_DB: ${POSTGRES_DB:-vulnvista}
      # initdb refuses to use a bind-mounted directory directly (any stray dotfile,
      # like a git .gitkeep placeholder, makes it look "non-empty"), so point it at
      # a subdirectory of the mount instead — the standard fix for bind-mounted PGDATA.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Bind-mounted to a host folder (not a Docker-managed volume) so the
      # database survives `docker compose down`, restarts, and even a full
      # Docker reinstall — the data lives at ./storage/postgres on the host.
      - ${POSTGRES_DATA_DIR:-./storage/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulnvista}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vulnvista_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vulnvista_backend
    restart: unless-stopped
    # No depends_on: the database is Neon (external). When running the local-db
    # profile, start postgres first (or just `docker compose --profile local-db up`).
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-change-me-generate-a-random-64-char-value}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      MAX_FAILED_LOGINS: ${MAX_FAILED_LOGINS:-5}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
      BACKEND_STORAGE_DIR: /data/uploads
      # Taken from .env (Neon). Falls back to the local-db container if unset.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://vulnvista:change-me-in-dev@postgres:5432/vulnvista}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      NVD_API_KEY: ${NVD_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-9000}:9000"
    volumes:
      # Live-reload source mount for development.
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts
      - ./backend/alembic:/app/alembic
      # Scan evidence / uploaded files persisted on the host, not in the container layer.
      - ${BACKEND_STORAGE_DIR:-./storage/uploads}:/data/uploads
      
    networks:
      - vulnvista_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vulnvista_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:9000/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Live-reload source mount for development; node_modules stays in the container.
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    networks:
      - vulnvista_net

  pgadmin:
    image: dpage/pgadmin4
    # Local DB UI — only relevant with the local-db profile.
    profiles: ["local-db"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    # Required: without this, Compose puts pgadmin on the implicit `default`
    # network while postgres is on vulnvista_net, and the `postgres` hostname
    # fails to resolve ([Errno -3]) no matter which port you use.
    networks:
      - vulnvista_net

networks:
  vulnvista_net:
    name: vulnvista_net
    external: true
