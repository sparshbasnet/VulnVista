# VulnVista lab targets — deliberately vulnerable applications only.
#
# Both this file and ../docker-compose.yml attach to the shared `vulnvista_net`
# network as `external: true` — neither one creates it, to avoid the two
# compose projects fighting over ownership of the same network. Run
# ../scripts/setup.sh (or `docker network create vulnvista_net`) once before
# starting either compose file.
#
# Usage (run from the repo root so the shared .env is picked up):
#   docker compose --env-file .env -f lab/docker-compose.yml up -d
#   docker compose --env-file .env -f lab/docker-compose.yml down

services:
  dvwa:
    image: vulnerables/web-dvwa
    container_name: vulnvista_dvwa
    restart: unless-stopped
    ports:
      - "${DVWA_PORT:-8080}:80"
    networks:
      - vulnvista_net

# To see if juice-shop is reachable from inside the ZAP container:
#   docker compose -f tools/docker-compose.yml exec zap sh
#   curl -s -o /dev/null -w "%{http_code}\n" http://juice-shop:3000  # should return 200 or 304
# Or:
#   docker compose -f tools/docker-compose.yml exec zap curl -s -o /dev/null -w "%{http_code}\n" http://juice-shop:3000
  juice-shop:
    image: bkimminich/juice-shop
    container_name: vulnvista_juice_shop
    restart: unless-stopped
    environment:
      # Juice Shop disables its own "unsafe" challenges (XXE, SSTi,
      # deserialization, some NoSQLi) by default whenever it detects it's
      # running in a container, since those exploits can crash shared/free
      # hosting. This is an isolated local lab network with no public
      # exposure, so it's safe to re-enable them — required for the xxe
      # detector's file-upload probe to reach real parsing instead of
      # short-circuiting with a generic 410.
      NODE_ENV: unsafe
    ports:
      - "${JUICE_SHOP_PORT:-3000}:3000"
    volumes:
      # Persist challenge progress / seeded data on the host.
      - ${JUICE_SHOP_DATA_DIR:-../storage/lab/juice-shop}:/juice_shop/data
    networks:
      - vulnvista_net

  # Metasploitable2: a deliberately vulnerable multi-service Linux box, used as
  # the target for the "Vulnerable Services" detector (CVE-dependent service
  # fingerprinting). There is no official Docker image for Metasploitable2
  # (see METASPLOITABLE.md) — this is a community repackaging of the same
  # rootfs the official VM ships, whose services are started by its own
  # /bin/services.sh boot script rather than the container's default
  # entrypoint. `tail -f /dev/null` after that keeps the container alive
  # headlessly under `docker compose up -d` (the image's own documented
  # command ends in a bare `bash`, which needs an attached TTY to not exit
  # immediately). bind9 (DNS) and NFS don't come up under Docker — they need
  # kernel modules the container can't load — that's expected, not a bug.
  #
  # Host ports are offset by +10000 from each service's real port, purely to
  # avoid colliding with anything already running on the host (22, 3306, and
  # 5432 in particular are common). The backend reaches every service at its
  # real port via the container's vulnvista_net DNS name (metasploitable2:<port>)
  # regardless of this mapping — host publishing here is for convenience only
  # # (e.g. manual `nmap -sV localhost -p10021,10022,...` from the host).
  metasploitable2:
    image: tleemcjr/metasploitable2
    container_name: vulnvista_metasploitable2
    restart: unless-stopped
    command: sh -c "/bin/services.sh && tail -f /dev/null"
    ports:
      - "10021:21"   # ftp (vsftpd 2.3.4 — CVE-2011-2523 backdoor)
      - "10022:22"   # ssh
      - "10023:23"   # telnet
      - "10025:25"   # smtp
      - "10053:53"   # dns (bind9 — usually doesn't start, see note above)
      - "10080:80"   # http
      - "10111:111"  # rpcbind
      - "10139:139"  # netbios-ssn (samba)
      - "10445:445"  # microsoft-ds (samba)
      - "10512:512"  # rexec
      - "10513:513"  # rlogin
      - "10514:514"  # rsh
      - "11099:1099" # java-rmi
      - "11524:1524" # ingreslock (root backdoor shell)
      - "12049:2049" # nfs (usually doesn't start, see note above)
      - "12121:2121" # ftp (proftpd)
      - "13306:3306" # mysql
      - "13632:3632" # distccd (CVE-2004-2687)
      - "15432:5432" # postgresql
      - "15900:5900" # vnc
      - "16000:6000" # x11
      - "16200:6200" # vsftpd backdoor shell (post-trigger listener)
      - "16667:6667" # irc (UnrealIRCd — CVE-2010-2075 backdoor)
      - "18009:8009" # ajp13 (tomcat)
      - "18180:8180" # http (tomcat/manager)
    networks:
      - vulnvista_net

  # # Deliberately weak TLS configuration for the weak_tls detector — see
  # tls-test/Dockerfile for why this needs a custom build rather than a
  # pulled image (modern nginx/OpenSSL refuse to negotiate TLSv1.0/1.1 or
  # RC4/3DES/MD5 ciphers even when explicitly configured to).
  # tls-test:
  #   build:
  #     context: ./tls-test
  #   container_name: vulnvista_tls_test
  #   restart: unless-stopped
  #   ports:
  #     - "${TLS_TEST_PORT:-8443}:443"
  #   networks:
  #     - vulnvista_net

networks:
  vulnvista_net:
    name: vulnvista_net
    external: true
