worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 443 ssl;
        server_name tls-test;

        ssl_certificate /etc/nginx/weak.crt;
        ssl_certificate_key /etc/nginx/weak.key;

        # Deliberately weak — this is the whole point of this lab target.
        # SECLEVEL=0 drops OpenSSL's own minimum-strength floor so the RC4/
        # 3DES/MD5 ciphers below actually get offered instead of silently
        # skipped.
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers 'ALL:!aNULL:@SECLEVEL=0';
        ssl_prefer_server_ciphers on;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}
